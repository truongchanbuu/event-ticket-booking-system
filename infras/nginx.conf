# Nginx dev reverse proxy + LB
# Lưu ý: trong Docker Compose, hostname "api" sẽ resolve tới TẤT CẢ replicas (api-1, api-2, ...).
# Ta cấu hình resolver 127.0.0.11 (Docker DNS) để Nginx re-resolve định kỳ => pseudo round-robin.

worker_processes  auto;

events { worker_connections  4096; }

http {
  # Tối ưu keepalive và timeouts cho loadtest
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  upstream apipool {
    # Chỉ định 1 server tên "api" — Docker DNS trả nhiều IP, resolver phía dưới sẽ xoay vòng.
    server api:3000 max_fails=0;
    keepalive 128;
  }

  server {
    listen 8080;
    # Re-resolve tên "api" qua Docker DNS mỗi 5s
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Health của Nginx để tiện check
    location = /nginx-health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Proxy mặc định: cân tải tới apipool
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_connect_timeout 2s;
      proxy_buffering off;
      proxy_pass http://apipool;
    }
  }
}
