version: "3.9"

services:
  # API của bạn. Có thể scale bằng: docker compose ... up -d --scale api=6
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      # Bật debug hot-path nếu cần
      DEBUG_RESERVE: "0"
    depends_on:
      - redis
    expose:
      - "3000"
    # Health endpoints (khuyến nghị có sẵn trong service của bạn)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 8

  # Redis TCP cho hot-path (KHÔNG dùng Upstash REST ở hot-path)
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--save",
        "900",
        "1",
        "--save",
        "300",
        "10",
        "--save",
        "60",
        "10000",
      ]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  # Nginx reverse proxy cân tải đến các replica api
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    environment:
      # Docker DNS resolver
      - DOCKER_INTERNAL_RESOLVER=127.0.0.11

  # (Tuỳ chọn) Kafka local — nếu muốn test publish async (non-blocking)
  # kafka:
  #   image: bitnami/kafka:3.7
  #   environment:
  #     - KAFKA_ENABLE_KRAFT=yes
  #     - KAFKA_CFG_NODE_ID=1
  #     - KAFKA_CFG_PROCESS_ROLES=broker,controller
  #     - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
  #     - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
  #     - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
  #     - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  #     - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
  #   ports:
  #     - "9092:9092"

volumes:
  redis-data:
